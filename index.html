<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaun Banega Gursikh</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Bebas+Neue&family=Crimson+Text:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold:        #FFD700;
  --gold-bright: #FFF176;
  --gold-deep:   #FF8C00;
  --gold-dark:   #A05800;
  --white:       #FFFFFF;
  --bg:          #050301;
  --kbc-blue:        #0A0500;
  --kbc-blue-light: #241405;
  --kbc-green:      #002800;
  --kbc-green-light:#00FF00;
  --header-h:    140px;
}

html, body {
  width: 100%; min-height: 100%;
  background: radial-gradient(circle at center, #1F1104 0%, var(--bg) 70%, #000000 100%);
  color: var(--white); overflow-x: hidden;
  font-family: 'Crimson Text', serif;
}

/* ─── STUDIO LIGHTS & STARS ─── */
#kbc-lights {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: conic-gradient(from 180deg at 50% -10%, transparent 38%, rgba(255,215,0,0.03) 46%, rgba(255,215,0,0.06) 50%, rgba(255,215,0,0.03) 54%, transparent 62%);
}
#stars-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--dur) var(--delay) infinite alternate ease-in-out;
}
@keyframes twinkle {
  0%   { opacity: var(--lo); transform: scale(0.75); }
  100% { opacity: var(--hi); transform: scale(1.3); }
}

/* ═══════════════════════════════════════
   INTRO SCREEN 
═══════════════════════════════════════ */
#intro-screen {
  position: fixed; inset: 0;
  background: #000;
  z-index: 2000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 1.5s ease, visibility 1.5s;
  overflow: hidden;
}

/* Canvas fills the intro screen — handles warp + Earth */
#intro-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
  display: none; /* shown when animation starts */
}

/* Logo: shown during phase 3 */
#intro-logo {
  position: absolute; z-index: 3;
  width: 90vw; max-width: 620px; height: auto;
  display: none; opacity: 0;
  /* GPU-layer tricks for sharp scaling */
  will-change: transform, opacity;
  transform: translateZ(0) scale(0.05);
  backface-visibility: hidden;
  image-rendering: auto;
  mix-blend-mode: screen;
  filter: drop-shadow(0 0 10px rgba(255,215,0,0.4));
  transition: none;
}
#intro-logo.logo-reveal {
  animation: logoGrandReveal 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes logoGrandReveal {
  0%   { opacity: 0;   transform: translateZ(0) scale(0.05); filter: brightness(3) drop-shadow(0 0 40px rgba(255,215,0,0.9)); }
  18%  { opacity: 1;   transform: translateZ(0) scale(1.12); filter: brightness(1.6) drop-shadow(0 0 30px rgba(255,215,0,0.7)); }
  32%  { transform: translateZ(0) scale(0.94); }
  45%  { transform: translateZ(0) scale(1.06); filter: brightness(1.2) drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
  58%  { transform: translateZ(0) scale(0.98); }
  72%  { transform: translateZ(0) scale(1.02); }
  100% { opacity: 1;   transform: translateZ(0) scale(1);    filter: drop-shadow(0 0 12px rgba(255,215,0,0.4)); }
}

/* Steady glow once logo settles */
#intro-logo.logo-settled {
  animation: logoGlow 2s ease-in-out infinite alternate;
}
@keyframes logoGlow {
  from { filter: drop-shadow(0 0 10px rgba(255,215,0,0.35)); }
  to   { filter: drop-shadow(0 0 28px rgba(255,215,0,0.7)); }
}

/* "Enter Studio" button */
.start-intro-btn {
  position: relative; z-index: 4;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.5rem; letter-spacing: 0.15em;
  color: #050301;
  background: linear-gradient(135deg, #FFF176 0%, #FFD700 40%, #FF8C00 100%);
  padding: 15px 50px; border: none; border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255,215,0,0.5);
  transition: transform 0.3s, opacity 0.5s;
}
.start-intro-btn:hover { transform: scale(1.05); }

/* kbg-logo shared class (header logos) */
.kbg-logo {
  object-fit: contain;
  mix-blend-mode: screen;
  filter: drop-shadow(0 0 10px rgba(255,215,0,0.4));
  /* Sharpen on GPU */
  will-change: transform;
  transform: translateZ(0);
  backface-visibility: hidden;
}

/* ─── FIXED HEADER ─── */
.site-header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 4vw;
  background: linear-gradient(to bottom, rgba(5,3,1,1) 0%, rgba(5,3,1,0.9) 75%, rgba(5,3,1,0) 100%);
  opacity: 0; transition: opacity 2s ease;
}
.header-center { text-align: center; flex: 1; }
.header-side-logo {
  width: 120px; height: auto; flex-shrink: 0;
  opacity: 0; transform: scale(0);
  transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s;
}
@media (max-width: 600px) { .header-side-logo { display: none; } }
.header-sub {
  font-family: 'Cinzel Decorative', serif; font-weight: 700;
  font-size: clamp(0.6rem, 1.5vw, 1rem);
  color: var(--white); letter-spacing: 0.4em; text-transform: uppercase;
  text-shadow: 0 0 12px rgba(255,215,0,0.8); margin-bottom: 2px;
}
.header-main {
  font-family: 'Cinzel Decorative', serif; font-weight: 900;
  font-size: clamp(1.6rem, 4vw, 3.5rem);
  color: var(--white); letter-spacing: 0.04em; line-height: 1.1;
  text-shadow: 0 0 5px #fff, 0 0 15px var(--gold), 0 0 30px var(--gold-deep), 2px 2px 0px #000;
}

/* ─── APP SHELL ─── */
#app {
  position: relative; z-index: 10;
  padding-top: var(--header-h);
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-bottom: 50px;
  opacity: 0; transition: opacity 2s ease 0.5s;
}

/* ─── VIEW 1: WHEEL ─── */
#view-wheel {
  display: flex; flex-direction: column;
  align-items: center; gap: 26px; width: 100%;
}
.wheel-outer { position: relative; padding-bottom: 48px; }
#wheelCanvas {
  display: block; border-radius: 50%;
  filter: drop-shadow(0 0 32px rgba(255,200,0,0.45)) drop-shadow(0 0 70px rgba(255,140,0,0.2));
  will-change: transform;
}
.wheel-pointer {
  position: absolute; bottom: 4px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 38px solid #FF3030;
  filter: drop-shadow(0 0 12px rgba(255,48,48,0.9)) drop-shadow(0 0 6px rgba(255,140,0,0.6)); z-index: 5;
}
.remaining-label {
  font-family: 'Cinzel Decorative', serif; font-size: clamp(0.85rem, 2vw, 1.1rem);
  color: var(--gold); letter-spacing: 0.25em; text-shadow: 0 0 12px rgba(255,215,0,0.5); opacity: 0.85;
}
.spin-btn {
  font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.8rem, 4vw, 2.8rem);
  letter-spacing: 0.22em; color: #0A0A20;
  background: linear-gradient(135deg, #FFF176 0%, #FFD700 40%, #FF8C00 100%);
  border: none; padding: clamp(12px, 2vw, 18px) clamp(40px, 8vw, 80px);
  border-radius: 5px; cursor: pointer;
  box-shadow: 0 0 18px rgba(255,215,0,0.65), 0 0 45px rgba(255,140,0,0.35), inset 0 1px 0 rgba(255,255,200,0.6), inset 0 -2px 4px rgba(160,80,0,0.4);
  transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden;
}
.spin-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%); pointer-events: none;
}
.spin-btn:not(:disabled):hover { transform: scale(1.055); box-shadow: 0 0 30px rgba(255,215,0,0.85), 0 0 70px rgba(255,140,0,0.5); }
.spin-btn:not(:disabled):active { transform: scale(0.96); }
.spin-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ─── VIEW 2: QUESTION CARD ─── */
#view-question {
  display: none; flex-direction: column; align-items: center;
  width: 92%; max-width: 820px; text-align: center; gap: clamp(8px, 1.5vw, 14px);
}
.q-label, .q-number { transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease, text-shadow 0.8s ease; }
#view-question.focus-number .q-label { transform: scale(1.4) translateY(-15px); opacity: 0.9; }
#view-question.focus-number .q-number {
  transform: scale(1.5) translateY(10px);
  text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 80px rgba(255,150,0,0.8), 0 0 120px rgba(255,255,255,0.3);
}
#questionRevealWrapper {
  display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.8s cubic-bezier(0.25, 1, 0.5, 1); width: 100%;
}
#view-question.focus-number #questionRevealWrapper { grid-template-rows: 0fr; }
#questionRevealArea {
  min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center;
  gap: clamp(12px, 2.5vw, 22px); opacity: 1; transform: translateY(0);
  transition: opacity 0.8s ease 0.2s, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); padding: 10px 0;
}
#view-question.focus-number #questionRevealArea { opacity: 0; transform: translateY(30px); transition: opacity 0.2s, transform 0.2s; }

.q-label { font-family: 'Cinzel Decorative', serif; font-size: clamp(0.7rem, 1.6vw, 1rem); color: var(--gold); letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.7; }
.q-number { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem, 15vw, 8rem); color: var(--gold); line-height: 1; text-shadow: 0 0 18px rgba(255,215,0,0.95), 0 0 40px rgba(255,150,0,0.65), 4px 4px 0 rgba(120,60,0,0.85), 8px 8px 0 rgba(80,30,0,0.4); }

.q-text {
  font-family: 'Crimson Text', serif; font-size: clamp(1.2rem, 2.6vw, 1.9rem); color: var(--white); line-height: 1.55;
  width: 100%; max-width: 780px;
  background: linear-gradient(180deg, var(--kbc-blue) 0%, var(--kbc-blue-light) 100%);
  border: 2px solid var(--gold); border-radius: 50px; padding: 24px 40px;
  box-shadow: 0 0 20px rgba(255,215,0,0.15), inset 0 0 15px rgba(0,0,0,0.6);
  position: relative; text-shadow: 0 0 10px rgba(255,255,255,0.3); margin-top: 8px;
}
.q-text::before, .q-text::after {
  content: ''; position: absolute; top: 50%; width: 40px; height: 2px;
  background: var(--gold); transform: translateY(-50%); box-shadow: 0 0 8px var(--gold);
}
.q-text::before { right: 100%; } .q-text::after { left: 100%; }

/* ─── LIFELINE ROW ─── */
.lifeline-row {
  display: flex; justify-content: center; align-items: center; gap: 24px;
  width: 100%; padding: 4px 0;
}

.lifeline-btn {
  position: relative;
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 2.5px solid rgba(255, 215, 0, 0.45);
  background: radial-gradient(circle at 38% 34%, rgba(255,215,0,0.1) 0%, rgba(255,215,0,0.03) 100%);
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: rgba(255, 215, 0, 0.75);
  font-family: 'Bebas Neue', sans-serif;
  box-shadow: 0 0 14px rgba(255,215,0,0.08), inset 0 0 12px rgba(0,0,0,0.4);
  transition: border-color 0.4s, box-shadow 0.4s, background 0.4s, color 0.4s, transform 0.2s;
  overflow: visible;
}
.lifeline-btn:hover:not(.used) {
  border-color: rgba(255,215,0,0.75);
  box-shadow: 0 0 20px rgba(255,215,0,0.2), inset 0 0 10px rgba(255,215,0,0.05);
  transform: scale(1.06);
}
.lifeline-btn .lifeline-icon {
  font-size: 2.8rem; line-height: 1;
  filter: drop-shadow(0 0 4px rgba(255,215,0,0.4));
  transition: filter 0.4s;
}
.lifeline-btn .lifeline-name {
  font-size: 0.75rem; letter-spacing: 0.14em; text-align: center; line-height: 1.2;
  text-transform: uppercase; opacity: 0.85;
}

.lifeline-btn.used {
  border-color: var(--gold);
  color: var(--gold);
  background: radial-gradient(circle at 38% 34%, rgba(255,215,0,0.35) 0%, rgba(255,140,0,0.12) 100%);
  box-shadow:
    0 0 0 3px rgba(255,215,0,0.2),
    0 0 28px rgba(255,215,0,0.65),
    0 0 60px rgba(255,140,0,0.3),
    inset 0 0 18px rgba(255,215,0,0.12);
  animation: lifelineBlast 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.lifeline-btn.used .lifeline-icon {
  filter: drop-shadow(0 0 10px rgba(255,215,0,0.9)) drop-shadow(0 0 3px #fff);
}

@keyframes lifelineBlast {
  0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,215,0,0.8), 0 0 28px rgba(255,215,0,0.65), inset 0 0 18px rgba(255,215,0,0.12); }
  12%  { transform: scale(1.22); box-shadow: 0 0 0 10px rgba(255,215,0,0.25), 0 0 50px rgba(255,215,0,0.9), inset 0 0 22px rgba(255,215,0,0.2); }
  28%  { transform: scale(1.08); }
  42%  { transform: scale(1.16); }
  60%  { transform: scale(1.05); }
  100% { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(255,215,0,0.15), 0 0 28px rgba(255,215,0,0.65), 0 0 60px rgba(255,140,0,0.3), inset 0 0 18px rgba(255,215,0,0.12); }
}

.lifeline-btn.used::after {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 2px solid rgba(255,215,0,0.6);
  animation: lifelineRipple 1.2s ease-out forwards;
}
@keyframes lifelineRipple {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.6); }
}

.lifeline-badge {
  position: absolute; top: -10px;
  left: 50%; transform: translateX(-50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.6rem; letter-spacing: 0.25em;
  color: #050301;
  background: linear-gradient(135deg, #FFF176 0%, #FFD700 60%, #FF8C00 100%);
  padding: 2px 8px; border-radius: 20px;
  white-space: nowrap;
  opacity: 0; transform: translateX(-50%) translateY(4px);
  transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
  pointer-events: none;
  box-shadow: 0 0 10px rgba(255,215,0,0.5);
}
.lifeline-btn.used .lifeline-badge {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

/* ─── TIMER ─── */
.timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.timer-sub { font-family: 'Cinzel Decorative', serif; font-size: clamp(0.6rem, 1.4vw, 0.85rem); letter-spacing: 0.35em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
.timer-display { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4.5rem, 18vw, 9rem); color: var(--white); line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 50px rgba(200,220,255,0.4); transition: color 0.3s ease, text-shadow 0.3s ease; }
.timer-display.urgent { color: var(--gold-deep); text-shadow: 0 0 18px rgba(255,140,0,0.95), 0 0 40px rgba(255,140,0,0.7), 0 0 80px rgba(255,140,0,0.35); animation: urgentPulse 0.45s infinite alternate; }
@keyframes urgentPulse { from { transform: scale(1); } to { transform: scale(1.06); } }

/* ─── ANSWER ─── */
.answer-text {
  font-family: 'Crimson Text', serif; font-style: italic; font-size: clamp(1.4rem, 3.2vw, 2.1rem); line-height: 1.4; transition: opacity 0.55s ease, transform 0.55s ease; width: 100%; max-width: 780px;
  background: linear-gradient(180deg, var(--kbc-green) 0%, #001100 100%); border: 2px solid var(--kbc-green-light); border-radius: 50px; color: var(--white); padding: 18px 40px; position: relative; text-shadow: 0 0 10px rgba(255,255,255,0.5); box-shadow: 0 0 25px rgba(0,255,0,0.25), inset 0 0 15px rgba(0,0,0,0.8);
}
.answer-text::before, .answer-text::after { content: ''; position: absolute; top: 50%; width: 40px; height: 2px; background: var(--kbc-green-light); transform: translateY(-50%); box-shadow: 0 0 8px var(--kbc-green-light); }
.answer-text::before { right: 100%; } .answer-text::after { left: 100%; }
.answer-text.hidden { opacity: 0; transform: translateY(14px); pointer-events: none; user-select: none; }

@media (max-width: 768px) {
  .q-text::before, .q-text::after, .answer-text::before, .answer-text::after { display: none; }
  .q-text, .answer-text { padding: 16px 24px; border-radius: 35px; }
}

/* ─── CONTROL BUTTONS ─── */
.controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 4px; }
.ctrl-btn { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.2rem, 2.5vw, 1.7rem); letter-spacing: 0.14em; padding: clamp(10px, 1.5vw, 14px) clamp(20px, 4vw, 34px); border: 2px solid rgba(255,215,0,0.75); border-radius: 4px; background: rgba(255,215,0,0.06); color: var(--gold); cursor: pointer; transition: all 0.2s ease; text-shadow: 0 0 8px rgba(255,215,0,0.45); box-shadow: 0 0 12px rgba(255,215,0,0.12); }
.ctrl-btn:hover { background: rgba(255,215,0,0.18); box-shadow: 0 0 22px rgba(255,215,0,0.38), inset 0 0 14px rgba(255,215,0,0.08); transform: translateY(-2px); }
.ctrl-btn:active { transform: translateY(0); } .ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
.ctrl-btn.accent { background: rgba(255,215,0,0.2); border-color: var(--gold); }
.ctrl-btn.paused { background: rgba(255,100,0,0.18); border-color: #FF8C00; color: #FF8C00; text-shadow: 0 0 8px rgba(255,140,0,0.6); }

/* ─── GAME-OVER BANNER ─── */
.all-done-msg { display: none; font-family: 'Cinzel Decorative', serif; font-size: clamp(1.4rem, 4vw, 2.8rem); color: var(--gold); text-align: center; text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 50px rgba(255,215,0,0.4); padding: 30px 20px; line-height: 1.6; }

/* ─── VIEW 3: REVIEW ─── */
#view-review { display: none; flex-direction: column; align-items: center; width: 92%; max-width: 920px; text-align: center; gap: clamp(14px, 2.5vw, 24px); animation: fadeInUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) both; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.review-label { font-family: 'Cinzel Decorative', serif; font-size: clamp(0.65rem, 1.5vw, 0.9rem); color: var(--gold); letter-spacing: 0.45em; text-transform: uppercase; opacity: 0.65; }
.review-counter { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1rem, 2.5vw, 1.5rem); color: rgba(255,215,0,0.55); letter-spacing: 0.2em; }

.review-card { width: 100%; background: linear-gradient(180deg, var(--kbc-blue) 0%, var(--kbc-blue-light) 100%); border: 2px solid var(--gold); border-radius: 40px; padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: clamp(14px, 2.5vw, 22px); box-shadow: 0 0 40px rgba(255,215,0,0.06), inset 0 0 30px rgba(0,0,0,0.6); transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
.review-card.transitioning { opacity: 0; transform: translateY(20px); }

/* BATCH VIEW GRID STYLES */
.review-list { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; text-align: left; }
@media (min-width: 768px) { .review-list { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
.review-item { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,215,0,0.2); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
.review-item-num { font-family: 'Cinzel Decorative', serif; font-size: 0.85rem; color: rgba(255,215,0,0.8); letter-spacing: 0.15em; text-transform: uppercase; }
.review-item-q { font-family: 'Crimson Text', serif; font-size: 1.15rem; color: var(--white); line-height: 1.4; }
.review-item-a { font-family: 'Crimson Text', serif; font-style: italic; font-size: 1.25rem; color: var(--kbc-green-light); line-height: 1.4; text-shadow: 0 0 10px rgba(0,255,0,0.4); margin-top: 4px; }

.review-controls { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.review-btn-next { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: 0.18em; color: #0A0A20; background: linear-gradient(135deg, #FFF176 0%, #FFD700 40%, #FF8C00 100%); border: none; padding: clamp(10px, 1.8vw, 16px) clamp(32px, 6vw, 60px); border-radius: 5px; cursor: pointer; box-shadow: 0 0 18px rgba(255,215,0,0.5), 0 0 40px rgba(255,140,0,0.25), inset 0 1px 0 rgba(255,255,200,0.6); transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden; }
.review-btn-next::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 60%); pointer-events: none; }

<script>
const introAudio    = new Audio('intro.mp3');
const spinSound     = new Audio('freesound_community-wheel-spin-click-slow-down-101152.mp3');
const tickSound     = new Audio('voicebosch-ticking-clock-182894.mp3');
const buzzerSound   = new Audio('eritnhut1992-buzzer-or-wrong-answer-20582.mp3');
const questionSound = new Audio('kbc-question.mp3');
const lifelineSound = new Audio('coghezzi-sacred-rune-lock-holy-magic-seal-activation-533277.mp3');

function stopTickSound() { tickSound.pause(); tickSound.currentTime = 0; }

/* ═══════════════════════════════════════════════════
   ★ ANIMATOR UPDATE ★
═══════════════════════════════════════════════════ */
const IntroAnim = (() => {

  // Timing adjusted so Vancouver holds for EXACTLY 1 second before transitioning
  const P1_END = 8000, P2_START = 7000, P2_END = 17500, P3_START = 17000, TOTAL = 25500;

  let canvas, ctx, rafId, startTime, earthImg;
  let warpStars = [];

  function buildEarth(size) {
    const oc = document.createElement('canvas');
    oc.width = oc.height = size;
    const c = oc.getContext('2d');
    const r = size / 2 - 2, cx = size / 2, cy = size / 2;

    c.save();
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();

    /* Richer Ocean Depth */
    const og = c.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
    og.addColorStop(0, '#2b90d9'); og.addColorStop(0.35, '#1e68b8');
    og.addColorStop(0.75, '#0a3675'); og.addColorStop(1, '#051838');
    c.fillStyle = og; c.fillRect(0, 0, size, size);

    function continent(pts, light, dark) {
      c.beginPath();
      const px = pts.map(([x, y]) => [cx + x * r, cy + y * r]);
      c.moveTo(px[0][0], px[0][1]);
      for (let i = 1; i < px.length - 1; i++) {
        const mx = (px[i][0] + px[i + 1][0]) / 2;
        const my = (px[i][1] + px[i + 1][1]) / 2;
        c.quadraticCurveTo(px[i][0], px[i][1], mx, my);
      }
      c.closePath();
      const g = c.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      g.addColorStop(0, light); g.addColorStop(1, dark);
      c.fillStyle = g; c.fill();
    }

    /* Continents with deeper satellite colors */
    continent([[-0.58,-0.5],[-0.44,-0.62],[-0.28,-0.58],[-0.18,-0.5],[-0.12,-0.42],[-0.1,-0.32],[-0.14,-0.22],[-0.18,-0.08],[-0.2,0.06],[-0.18,0.18],[-0.22,0.32],[-0.22,0.44],[-0.12,0.5],[-0.02,0.5],[0.08,0.44],[0.2,0.32],[0.26,0.2],[0.3,0.06],[0.34,-0.1],[0.38,-0.24],[0.44,-0.34],[0.4,-0.44],[0.32,-0.5],[0.2,-0.56],[0.08,-0.62],[0.0,-0.62],[-0.1,-0.6],[-0.22,-0.64],[-0.38,-0.6]], '#2e5c26', '#143010');
    continent([[0.3,-0.64],[0.46,-0.6],[0.56,-0.48],[0.52,-0.36],[0.38,-0.34],[0.28,-0.44],[0.26,-0.58]], '#788991', '#4b5c63');
    continent([[0.0,0.5],[0.16,0.42],[0.28,0.5],[0.32,0.64],[0.28,0.82],[0.16,0.9],[0.04,0.9],[-0.08,0.78],[-0.1,0.62],[-0.02,0.52]], '#327335', '#163b18');
    continent([[0.58,-0.54],[0.7,-0.5],[0.78,-0.38],[0.74,-0.24],[0.62,-0.2],[0.52,-0.3],[0.5,-0.44]], '#3f7035', '#1a3b14');
    continent([[0.52,-0.18],[0.7,-0.1],[0.78,0.06],[0.76,0.32],[0.66,0.52],[0.52,0.62],[0.42,0.52],[0.4,0.3],[0.46,0.08],[0.48,-0.06]], '#476922', '#21330d');
    continent([[-0.64,-0.62],[-0.78,-0.5],[-0.86,-0.32],[-0.82,-0.16],[-0.68,-0.14],[-0.58,-0.28],[-0.58,-0.46]], '#2e5c26', '#143010');
    
    [[-0.54,0.1],[-0.62,0.2],[-0.7,-0.05]].forEach(([x, y]) => {
      c.beginPath(); c.ellipse(cx + x * r, cy + y * r, r * 0.025, r * 0.018, 0, 0, Math.PI * 2);
      c.fillStyle = '#2e5c26'; c.fill();
    });

    /* City Lights (Night Side) */
    c.globalCompositeOperation = 'screen';
    c.fillStyle = 'rgba(255, 240, 200, 0.65)';
    for (let i = 0; i < 400; i++) {
      const lx = (Math.random() * 2 - 1);
      const ly = (Math.random() * 2 - 1);
      if (lx * lx + ly * ly < 0.9) {
        const px = cx + lx * r; const py = cy + ly * r;
        if (lx > 0.1 && Math.random() > 0.4) {
          c.beginPath(); c.arc(px, py, Math.random() * 1.5, 0, Math.PI * 2); c.fill();
        }
      }
    }
    c.globalCompositeOperation = 'source-over';

    /* Soft Clouds */
    c.globalAlpha = 0.45;
    c.fillStyle = '#f0f8ff';
    [
      [-0.28,-0.38,0.14,0.055], [0.12,-0.1,0.18,0.065], [-0.06,0.28,0.16,0.06],
      [0.36,0.38,0.18,0.07], [-0.48,-0.12,0.12,0.05], [0.6,-0.3,0.14,0.055], [-0.18,-0.68,0.22,0.065],
    ].forEach(([x, y, w, h]) => {
      c.beginPath(); c.ellipse(cx + x * r, cy + y * r, w * r, h * r, 0.3, 0, Math.PI * 2); c.fill();
    });
    c.globalAlpha = 1;

    /* Ice caps */
    c.beginPath(); c.arc(cx, cy - r * 0.82, r * 0.2, 0, Math.PI * 2);
    c.fillStyle = 'rgba(210,235,255,0.85)'; c.fill();
    c.beginPath(); c.arc(cx, cy + r * 0.88, r * 0.16, 0, Math.PI * 2);
    c.fillStyle = 'rgba(225,242,255,0.75)'; c.fill();

    /* Dramatic Night Shading */
    const ns = c.createRadialGradient(cx + r * 0.38, cy + r * 0.28, r * 0.15, cx, cy, r);
    ns.addColorStop(0, 'rgba(0,0,10,0)'); ns.addColorStop(0.5, 'rgba(0,0,20,0.15)'); ns.addColorStop(1, 'rgba(0,0,0,0.85)');
    c.fillStyle = ns; c.fillRect(0, 0, size, size);

    /* Bright Specular Sun Reflection */
    const ss = c.createRadialGradient(cx - r * 0.42, cy - r * 0.42, 0, cx, cy, r);
    ss.addColorStop(0, 'rgba(255,255,255,0.4)'); ss.addColorStop(0.3, 'rgba(255,255,255,0.08)'); ss.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = ss; c.fillRect(0, 0, size, size);

    c.restore();

    /* Thick Atmosphere Halo */
    const at = c.createRadialGradient(cx, cy, r * 0.93, cx, cy, r * 1.05);
    at.addColorStop(0, 'rgba(100,190,255,0.65)');
    at.addColorStop(0.55, 'rgba(50,130,255,0.25)');
    at.addColorStop(1, 'rgba(20,60,200,0)');
    c.beginPath(); c.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
    c.fillStyle = at; c.fill();

    return oc;
  }

  function genStars() {
    warpStars = [];
    for (let i = 0; i < 380; i++) {
      warpStars.push({
        angle:  Math.random() * Math.PI * 2,
        dist:   Math.sqrt(Math.random()) * 0.88 + 0.04,
        speed:  Math.random() * 1.5 + 0.5, // Increased from (0.8 + 0.25)
        size:   Math.random() * 1.8 + 0.5,
        bright: Math.random() * 0.4 + 0.6,
        color:  Math.random() < 0.18 ? '#FFE082' : Math.random() < 0.1 ? '#BBDEFB' : '#FFFFFF',
      });
    }
  }

  function drawWarp(t) {
    const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
    const maxD = Math.sqrt(cx * cx + cy * cy) * 1.1;

    // Cinematic Acceleration (Cubic Ease) for natural speed up
    const easeAccel = Math.pow(Math.min(t / 6, 1), 3); 
    const intensity = easeAccel;
    
    const fadeIn    = Math.min(t / 0.6, 1);
    const fadeOut   = t > 7.0 ? Math.max(1 - (t - 7.0) / 1.0, 0) : 1;
    const masterAlpha = fadeIn * fadeOut;
    if (masterAlpha <= 0) return;

    warpStars.forEach(s => {
      const d  = s.dist * maxD;
      const x1 = cx + Math.cos(s.angle) * d;
      const y1 = cy + Math.sin(s.angle) * d;
      const streakLen = maxD * intensity * s.speed * (d / maxD) * 0.45;
      const x2 = cx + Math.cos(s.angle) * (d + streakLen);
      const y2 = cy + Math.sin(s.angle) * (d + streakLen);

      ctx.globalAlpha = s.bright * masterAlpha;

      if (intensity < 0.12) {
        ctx.beginPath(); ctx.fillStyle = s.color;
        ctx.arc(x1, y1, s.size * 0.7, 0, Math.PI * 2); ctx.fill();
      } else {
        const g = ctx.createLinearGradient(x1, y1, x2, y2);
        g.addColorStop(0, s.color); g.addColorStop(0.25, s.color); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.strokeStyle = g;
        ctx.lineWidth = s.size * (0.5 + intensity * 2);
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        
        ctx.beginPath(); ctx.fillStyle = s.color;
        ctx.arc(x1, y1, s.size * 0.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Base speed gets injected with extreme ease-in boost
      s.dist += s.speed * (0.0004 + easeAccel * 0.045);
      if (s.dist > 1.05) s.dist = 0.005 + Math.random() * 0.025;
    });
  }

  const VX_FRAC = -0.12, VY_FRAC = -0.35; 

  function drawEarth(t) {
    const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
    
    // Zoom curve that heavily decelerates and "Hangs" there for the last 3 seconds
    const rawProg = Math.min(t / 8.5, 1); 
    const prog = 1 - Math.pow(1 - rawProg, 4); // Cinematic Ease-Out Quart

    const fadeIn  = Math.min(t / 1.2, 1);
    const fadeOut = t > 9.5 ? Math.max(1 - (t - 9.5) / 1.0, 0) : 1;
    const alpha   = fadeIn * fadeOut;
    if (alpha <= 0 || !earthImg) return;

    // Bigger scale to make Vancouver very close and massive
    const scale       = 1 + 8.5 * Math.pow(prog, 1.9);
    const baseRadius  = Math.min(W, H) * 0.27;
    const earthRadius = baseRadius * scale;

    const earthX = cx - VX_FRAC * earthRadius;
    const earthY = cy - VY_FRAC * earthRadius;

    ctx.save();
    ctx.globalAlpha = alpha;

    const ar = earthRadius * 1.09;
    const ag = ctx.createRadialGradient(earthX, earthY, earthRadius * 0.94, earthX, earthY, ar);
    ag.addColorStop(0, 'rgba(100,190,255,0.55)');
    ag.addColorStop(0.55, 'rgba(50,120,255,0.18)');
    ag.addColorStop(1, 'rgba(20,50,200,0)');
    ctx.beginPath(); ctx.arc(earthX, earthY, ar, 0, Math.PI * 2);
    ctx.fillStyle = ag; ctx.fill();

    ctx.drawImage(earthImg, earthX - earthRadius, earthY - earthRadius, earthRadius * 2, earthRadius * 2);

    // Vancouver marker (massive and dynamic)
    if (prog > 0.60) {
      const mAlpha = Math.pow((prog - 0.60) / 0.40, 1.5) * fadeOut;
      if (mAlpha > 0.01) {
        ctx.globalAlpha = mAlpha;
        const pulse   = 0.8 + 0.2 * Math.sin(performance.now() / 150);
        
        // Massive dot and Label
        const dotR    = Math.max(12, Math.min(earthRadius * 0.05, 38)) * pulse;
        const labelSz = Math.max(20, Math.min(earthRadius * 0.08, 65));

        // Radar Expanding Wave
        const wave = (performance.now() % 2000) / 2000;
        ctx.beginPath(); ctx.arc(cx, cy, dotR + wave * 90, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 215, 0, ${1 - wave})`;
        ctx.lineWidth = 4; ctx.stroke();

        /* Glow */
        const mg = ctx.createRadialGradient(cx, cy, 0, cx, cy, dotR * 5.5);
        mg.addColorStop(0, 'rgba(255,215,0,0.9)');
        mg.addColorStop(0.4, 'rgba(255,140,0,0.35)');
        mg.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.beginPath(); ctx.arc(cx, cy, dotR * 5.5, 0, Math.PI * 2);
        ctx.fillStyle = mg; ctx.fill();

        /* Center Dot */
        ctx.beginPath(); ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700'; ctx.fill();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

        /* Label */
        if (prog > 0.76) {
          const lAlpha = (prog - 0.76) / 0.24 * fadeOut;
          ctx.globalAlpha = lAlpha;
          ctx.font = `bold ${labelSz}px 'Bebas Neue', sans-serif`;
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = 'rgba(0,0,0,0.9)';
          ctx.strokeText('VANCOUVER', cx, cy - dotR - 15);
          ctx.fillStyle = '#FFD700';
          ctx.fillText('VANCOUVER', cx, cy - dotR - 15);
        }
      }
    }

    // Whiteout bridging to logo
    if (t > 10.0) {
      const fl = (t - 10.0) / 0.5;
      ctx.globalAlpha = Math.min(fl, 1);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const W = canvas.width, H = canvas.height;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (elapsed < P1_END) {
      drawWarp(elapsed / 1000); 
    }
    if (elapsed >= P2_START && elapsed < P2_END) {
      drawEarth((elapsed - P2_START) / 1000); 
    }

    if (elapsed < TOTAL) {
      rafId = requestAnimationFrame(animate);
    }
  }

  return {
    init() {
      canvas = document.getElementById('intro-canvas');
      ctx    = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      });
      genStars();
      earthImg = buildEarth(1000);
    },

    start() {
      canvas.style.display = 'block';
      startTime = null;
      rafId = requestAnimationFrame(animate);

      setTimeout(() => {
        const logo = document.getElementById('intro-logo');
        logo.style.display = 'block';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          logo.classList.add('logo-reveal');
        }));
        setTimeout(() => {
          logo.classList.remove('logo-reveal');
          logo.style.transform = 'translateZ(0) scale(1)';
          logo.style.opacity   = '1';
          logo.classList.add('logo-settled');
        }, 3000);
      }, P3_START);

      setTimeout(() => {
        const introScreen = document.getElementById('intro-screen');
        const app         = document.getElementById('app');
        const siteHeader  = document.getElementById('site-header');
        const sideLogos   = document.querySelectorAll('.header-side-logo');

        introScreen.style.opacity    = '0';
        introScreen.style.visibility = 'hidden';
        app.style.opacity            = '1';
        siteHeader.style.opacity     = '1';

        setTimeout(() => {
          sideLogos.forEach(l => { l.style.opacity = '1'; l.style.transform = 'scale(1)'; });
        }, 500);

        if (rafId) cancelAnimationFrame(rafId);
      }, TOTAL);
    }
  };
})();

/* ═══════════════════════════════════════════════════
   REST OF THE LOGIC

});

    bg.appendChild(s);
  }
})();

const TAMBOLA = [
  { n:  1, q: "When and where was Baba Hardev Singh Ji born?(Date,Year,City)",                        a: "February 23, 1954,Delhi" },

let remaining      = TAMBOLA.map(t => t.n);
let currentNumber  = null;
let totalRotation  = 0;
let isSpinning     = false;
let timerInterval  = null;
let timerSeconds   = 30;
let timerRunning   = false;
let revealTimeout  = null;
let elderUsed      = false;

const wheelCanvas = document.getElementById('wheelCanvas');
const ctx2d       = wheelCanvas.getContext('2d');

function wheelSize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const hh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 140;
  return Math.round(Math.min(vw * 0.86, 520, vh - hh - 150));
}

const SEG_COLOURS = [
  ['#FFD700','#080820'], ['#0D0B3A','#FFD700'],
  ['#FF8C00','#080820'], ['#0A1850','#FFF176'],
  ['#DAA520','#080820'], ['#160C50','#FFC200'],
];

function lighten(hex, amt) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&0xFF)+amt)},${Math.min(255,(n&0xFF)+amt)})`;
}

function drawWheel() {
  const SZ = wheelCanvas.width, CX = SZ / 2, CY = SZ / 2, R = CX - 8;
  ctx2d.clearRect(0, 0, SZ, SZ);
  const nums = remaining, n = nums.length;
  if (n === 0) return;
  const segRad = (2 * Math.PI) / n;
  for (let i = 0; i < n; i++) {
    const startA = i * segRad - Math.PI / 2, endA = startA + segRad, midA = (startA + endA) / 2;
    const [fill, textCol] = SEG_COLOURS[i % SEG_COLOURS.length];
    const gx = CX + R * 0.45 * Math.cos(midA), gy = CY + R * 0.45 * Math.sin(midA);
    const grad = ctx2d.createRadialGradient(gx, gy, 0, CX, CY, R);
    grad.addColorStop(0, lighten(fill, 40)); grad.addColorStop(1, fill);
    ctx2d.beginPath(); ctx2d.moveTo(CX, CY); ctx2d.arc(CX, CY, R, startA, endA); ctx2d.closePath();
    ctx2d.fillStyle = grad; ctx2d.fill();
    ctx2d.strokeStyle = 'rgba(255,255,255,0.22)'; ctx2d.lineWidth = 1.5; ctx2d.stroke();
    const tr = R * 0.68, tx = CX + tr * Math.cos(midA), ty = CY + tr * Math.sin(midA);
    const fs = n <= 8 ? 30 : n <= 12 ? 26 : n <= 18 ? 20 : 16;
    ctx2d.save(); ctx2d.translate(tx, ty); ctx2d.rotate(midA + Math.PI / 2);
    ctx2d.font = `bold ${fs}px 'Bebas Neue', sans-serif`;
    ctx2d.fillStyle = textCol; ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
    ctx2d.shadowColor = 'rgba(0,0,0,0.6)'; ctx2d.shadowBlur = 5;
    ctx2d.fillText(nums[i], 0, 0); ctx2d.restore();
  }
  const hubG = ctx2d.createRadialGradient(CX, CY, 0, CX, CY, 32);
  hubG.addColorStop(0, '#FFF9C4'); hubG.addColorStop(0.5, '#FFD700'); hubG.addColorStop(1, '#FF8C00');
  ctx2d.beginPath(); ctx2d.arc(CX, CY, 30, 0, 2 * Math.PI); ctx2d.fillStyle = hubG; ctx2d.fill();
  ctx2d.strokeStyle = 'rgba(255,255,255,0.6)'; ctx2d.lineWidth = 2.5; ctx2d.stroke();
  ctx2d.beginPath(); ctx2d.arc(CX, CY, 10, 0, 2 * Math.PI); ctx2d.fillStyle = '#05051A'; ctx2d.fill();
  const sh = ctx2d.createRadialGradient(CX - R * 0.25, CY - R * 0.25, 0, CX, CY, R);
  sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.45, 'rgba(255,255,255,0.05)'); sh.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx2d.beginPath(); ctx2d.arc(CX, CY, R, 0, 2 * Math.PI); ctx2d.fillStyle = sh; ctx2d.fill();
  ctx2d.beginPath(); ctx2d.arc(CX, CY, R, 0, 2 * Math.PI); ctx2d.strokeStyle = '#FFD700'; ctx2d.lineWidth = 5.5; ctx2d.stroke();
  ctx2d.beginPath(); ctx2d.arc(CX, CY, R - 8, 0, 2 * Math.PI); ctx2d.strokeStyle = 'rgba(255,255,255,0.35)'; ctx2d.lineWidth = 2; ctx2d.stroke();
}

function initWheelSize() {
  const sz = wheelSize();
  wheelCanvas.width = sz; wheelCanvas.height = sz;
}

const spinBtn      = document.getElementById('spinBtn');
const remainingLbl = document.getElementById('remainingLabel');
const allDoneMsg   = document.getElementById('allDoneMsg');

spinBtn.addEventListener('click', () => {
  if (isSpinning || remaining.length === 0) return;
  isSpinning = true; spinBtn.disabled = true;
  spinSound.currentTime = 0; spinSound.play();
  const idx = Math.floor(Math.random() * remaining.length);
  currentNumber = remaining[idx];
  const n = remaining.length, segDeg = 360 / n;
  let target = (((180 - (idx + 0.5) * segDeg) % 360) + 360) % 360;
  while (target < totalRotation + 360 * 6) target += 360;
  totalRotation = target;
  wheelCanvas.style.transition = 'transform 4.8s cubic-bezier(0.23, 1, 0.32, 1)';
  wheelCanvas.style.transform  = `rotate(${totalRotation}deg)`;
  setTimeout(() => { isSpinning = false; showQuestionView(); }, 4900);
});

const viewWheel    = document.getElementById('view-wheel');
const viewQuestion = document.getElementById('view-question');
const viewReview   = document.getElementById('view-review');

function showWheelView() {
  viewQuestion.style.display = 'none';
  viewReview.style.display   = 'none';
  viewWheel.style.display    = 'flex';

  remainingLbl.textContent = remaining.length > 0
    ? `${remaining.length} Number${remaining.length !== 1 ? 's' : ''} Remaining` : '';

  if (remaining.length === 0) {
    spinBtn.style.display    = 'none';
    allDoneMsg.style.display = 'block';
    remainingLbl.textContent = '';
  } else {
    spinBtn.style.display    = '';
    spinBtn.disabled         = false;
    allDoneMsg.style.display = 'none';
  }
  totalRotation = 0;
  wheelCanvas.style.transition = 'none';
  wheelCanvas.style.transform  = 'rotate(0deg)';
  initWheelSize(); drawWheel();
}

function showQuestionView() {
  viewWheel.style.display  = 'none';
  viewReview.style.display = 'none';
  viewQuestion.style.display = 'flex';

  clearTimeout(revealTimeout);
  viewQuestion.classList.add('focus-number');
  questionSound.currentTime = 0; questionSound.play();

  const data = TAMBOLA.find(t => t.n === currentNumber);
  document.getElementById('qNumber').textContent    = currentNumber;
  document.getElementById('qText').textContent      = data.q;
  document.getElementById('answerText').textContent = '✦ ' + data.a + ' ✦';
  document.getElementById('answerText').classList.add('hidden');

  resetLifeline();
  resetTimer();

  revealTimeout = setTimeout(() => {
    if (viewQuestion.style.display === 'flex') viewQuestion.classList.remove('focus-number');
  }, 3500);
}

function resetLifeline() {
  elderUsed = false;
  const btn = document.getElementById('elderLifelineBtn');
  btn.classList.remove('used');
}

/* ─── TOGGLEABLE LIFELINE ─── */
document.getElementById('elderLifelineBtn').addEventListener('click', () => {
  elderUsed = !elderUsed; // Toggle boolean state
  const btn = document.getElementById('elderLifelineBtn');
  if (elderUsed) {
    btn.classList.add('used');
    lifelineSound.currentTime = 0;
    lifelineSound.play();
  } else {
    btn.classList.remove('used');
  }
});

function resetTimer() {
  clearInterval(timerInterval); stopTickSound();
  timerRunning = false; timerSeconds = 30;
  const td   = document.getElementById('timerDisplay');
  const stBtn = document.getElementById('startTimerBtn');
  td.textContent = '30'; td.classList.remove('urgent');
  td.style.color = ''; td.style.textShadow = '';
  stBtn.disabled = false; stBtn.textContent = '▶ \u00A0Start Timer';
  stBtn.classList.remove('paused', 'accent'); stBtn.classList.add('accent');
}

document.getElementById('startTimerBtn').addEventListener('click', () => {
  const stBtn = document.getElementById('startTimerBtn');
  const td    = document.getElementById('timerDisplay');
  if (timerSeconds <= 0) return;

  if (!timerRunning) {
    timerRunning = true;
    stBtn.textContent = '⏸ \u00A0Pause';
    stBtn.classList.remove('accent'); stBtn.classList.add('paused');

    // Start playing continuous audio track
    tickSound.play();

    timerInterval = setInterval(() => {
      timerSeconds--;
      td.textContent = timerSeconds > 0 ? timerSeconds : '0';
      
      if (timerSeconds <= 5 && timerSeconds > 0) td.classList.add('urgent');
      if (timerSeconds <= 0) {
        clearInterval(timerInterval); timerRunning = false; stopTickSound();
        td.classList.remove('urgent');
        td.style.color = 'var(--gold-deep)';
        td.style.textShadow = '0 0 30px rgba(255,140,0,0.95), 0 0 70px rgba(255,140,0,0.5)';
        buzzerSound.currentTime = 0; buzzerSound.play();
        stBtn.disabled = true; stBtn.textContent = '✦ \u00A0Time\'s Up\u00A0 ✦';
        stBtn.classList.remove('paused');
      }
    }, 1000);
  } else {
    timerRunning = false; clearInterval(timerInterval); 
    // Just pause audio so it resumes where left off
    tickSound.pause();
    stBtn.textContent = '▶ \u00A0Resume';
    stBtn.classList.remove('paused'); stBtn.classList.add('accent');
  }
});

/* ─── REVEAL BUTTON NOW ACTS LIKE REVIEW BUTTON ─── */
document.getElementById('revealBtn').addEventListener('click', () => {
  clearInterval(timerInterval); stopTickSound(); timerRunning = false;
  
  // Directly trigger the Review Screen logic instead of showing current answer
  reviewIndex = 0; 
  loadReviewCard(reviewIndex, false);
  viewWheel.style.display    = 'none';
  viewQuestion.style.display = 'none';
  viewReview.style.display   = 'flex';
});

document.getElementById('backBtn').addEventListener('click', () => {
  clearTimeout(revealTimeout); clearInterval(timerInterval);
  stopTickSound(); timerRunning = false;
  remaining      = remaining.filter(n => n !== currentNumber);
  currentNumber = null;
  showWheelView();
});

let reviewIndex = 0;

document.getElementById('reviewBtn').addEventListener('click', () => {
  reviewIndex = 0; loadReviewCard(reviewIndex, false);
  viewWheel.style.display    = 'none';
  viewQuestion.style.display = 'none';
  viewReview.style.display   = 'flex';
});

document.getElementById('reviewBackBtn').addEventListener('click', () => {
  viewReview.style.display = 'none'; showWheelView();
});

document.getElementById('reviewNextBtn').addEventListener('click', () => {
  const totalPages = Math.ceil(TAMBOLA.length / 6);
  if (reviewIndex >= totalPages - 1) return;
  const card = document.getElementById('reviewCard');
  card.classList.add('transitioning');
  setTimeout(() => { reviewIndex++; loadReviewCard(reviewIndex, true); }, 350);
});

function loadReviewCard(pageIdx, animate) {
  const card    = document.getElementById('reviewCard');
  const nextBtn = document.getElementById('reviewNextBtn');
  const doneEl  = document.getElementById('reviewDone');

  const startIdx = pageIdx * 6;
  const endIdx   = Math.min(startIdx + 6, TAMBOLA.length);
  const total    = TAMBOLA.length;
  const totalPages = Math.ceil(total / 6);

  document.getElementById('reviewCounter').textContent = `Questions ${startIdx + 1} - ${endIdx} of ${total}`;

  // Generate HTML for 6 questions
  let html = '<div class="review-list">';
  for (let i = startIdx; i < endIdx; i++) {
    const data = TAMBOLA[i];
    html += `
      <div class="review-item">
        <div class="review-item-num">Question ${data.n}</div>
        <div class="review-item-q">${data.q}</div>
        <div class="review-item-a">✦ ${data.a} ✦</div>
      </div>
    `;
  }
  html += '</div>';
  card.innerHTML = html;

  nextBtn.disabled = pageIdx >= totalPages - 1;
  doneEl.classList.toggle('visible', pageIdx >= totalPages - 1);
  if (animate) card.classList.remove('transitioning');
}

initWheelSize(); drawWheel();

window.addEventListener('resize', () => {
  if (viewWheel.style.display !== 'none' && !isSpinning) {
    initWheelSize(); drawWheel();
    wheelCanvas.style.transition = 'none';
    wheelCanvas.style.transform  = `rotate(${totalRotation}deg)`;
  }
});
</script>
